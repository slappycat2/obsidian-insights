[project]
name = "obsidian-insights"
dynamic = ["version"]
description = "Analyse an Obsidian vault and produce a spreadsheet of its properties, values and tags."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Swen Larsen" }]
keywords = ["obsidian", "markdown", "yaml", "frontmatter", "spreadsheet", "vault"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "click>=8.2.1",
    "openpyxl>=3.1.5",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/slappycat2/obsidian-insights"
Issues = "https://github.com/slappycat2/obsidian-insights/issues"

[project.scripts]
# Installs an `ovi` command onto PATH inside the venv.
ovi = "ovi.ovi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: src/ovi/__init__.py.
# Everything else (the CLI's --version, SysConfig.sys_ver) reads it from there.
[tool.hatch.version]
path = "src/ovi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ovi"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
